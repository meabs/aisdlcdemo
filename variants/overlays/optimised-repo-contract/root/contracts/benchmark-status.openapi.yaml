openapi: 3.0.3
info: { title: Benchmark status API, version: 1.0.0 }
paths:
  /benchmark/status:
    get:
      responses:
        '200':
          description: Stable benchmark status
          content:
            application/json:
              schema:
                type: object
                required: [status, source]
                properties:
                  status: { type: string, enum: [ok] }
                  source: { type: string, enum: [strapi-community] }
